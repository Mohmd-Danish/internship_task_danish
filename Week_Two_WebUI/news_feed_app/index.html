<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Feed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>News Feed</h1>
        
        <div class="article-form">
            <input type="text" id="title" placeholder="Article Title" required>
            <textarea id="description" placeholder="Article Description" required></textarea>
            <input type="text" id="imageUrl" placeholder="Image URL">
            <!-- https://images.pexels.com/photos/674010/pexels-photo-674010.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1 -->
            <button id="addArticle">Add Article</button>
        </div>

        <div class="news-feed" id="newsFeed"></div>

        <!-- <div class="pagination" id="pagination"></div> -->
    </div>

    <script src="script.js"></script>
</body>
</html>
